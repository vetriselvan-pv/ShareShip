<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shareship — Shared Space for Partners</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Shareship is a collaborative web and mobile application for couples and family partners to sync calendars, expenses, and memories.">
  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/svg+xml" href="Shareship_logo.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="apple-touch-icon" type="image/svg+xml" href="Shareship_logo.svg">
  <link rel="manifest" href="manifest.json">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  
  <meta name="theme-color" content="#f2fcf5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="bg-[#f2fcf5] text-[#151d1a] antialiased select-none font-sans overflow-x-hidden">
  <app-root>
    <!-- Pre-bootstrap branded splash matching <app-splash-screen> for zero blank flash -->
    <div
      style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f2fcf5;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;padding:16px;"
    >
      <div
        style="width:112px;height:112px;border-radius:32px;background:#ffffff;padding:10px;border:1px solid #dbe5df;box-shadow:0 14px 38px rgba(70,101,87,0.16);display:flex;align-items:center;justify-content:center;"
      >
        <img
          src="logo.png"
          width="96"
          height="96"
          alt="Shareship Logo"
          style="width:100%;height:100%;object-fit:contain;border-radius:23px;"
        />
      </div>
      <div style="margin-top:20px;font-size:26px;font-weight:700;letter-spacing:-0.02em;color:#151d1a;line-height:1.2;">
        Shareship
      </div>
      <div style="margin-top:6px;font-size:13px;font-weight:500;color:#414844;">
        Shared space for partners
      </div>
    </div>
  </app-root>
</body>
</html>
